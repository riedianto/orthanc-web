[Definition]

# Ban action that inserts the banned IP into a dedicated chain referenced
# from the Docker DOCKER-USER filter chain. Docker traffic to published
# container ports traverses FORWARD/DOCKER-USER, NOT INPUT, so a standard
# iptables-multiport ban would not affect container traffic.

chain = f2b-orthanc-auth

actionstart = iptables -N f2b-orthanc-auth 2>/dev/null || true
              iptables -F f2b-orthanc-auth
              iptables -I DOCKER-USER 1 -j f2b-orthanc-auth

actionstop = iptables -D DOCKER-USER -j f2b-orthanc-auth 2>/dev/null || true
             iptables -F f2b-orthanc-auth 2>/dev/null || true
             iptables -X f2b-orthanc-auth 2>/dev/null || true

actioncheck = iptables -n -L DOCKER-USER | grep -q f2b-orthanc-auth

actionban = iptables -I f2b-orthanc-auth 1 -s <ip> -j DROP

actionunban = iptables -D f2b-orthanc-auth -s <ip> -j DROP 2>/dev/null || true

[Init]
