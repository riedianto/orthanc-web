services:
  dicom-receiver:
    build: ./dicom_receiver
    container_name: dicom-receiver
    restart: unless-stopped
    ports:
      - "4242:4242"
    environment:
      - RECEIVER_AE_TITLE=${DICOM_RECEIVER_AE_TITLE:-ORTHANC}
      - DICOM_STORE_PORT=4242
      - ORTHANC_DICOM_HOST=orthanc
      - ORTHANC_DICOM_PORT=4242
      - ORTHANC_DICOM_AET=${ORTHANC_AET:-ORTHANC}
      - WORKLISTS_DIR=/var/lib/orthanc/worklists
      - POSTGRES_HOST=orthanc-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./worklists:/var/lib/orthanc/worklists:ro
    depends_on:
      orthanc-postgres:
        condition: service_healthy
    networks:
      - orthanc-network

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: orthanc-server
    restart: unless-stopped
    ports:
      - "4243:4242"
    volumes:
      - ${LOCAL_DICOM_STORAGE_PATH:-./storage/dicom}:/var/lib/orthanc/db
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./scripts:/etc/orthanc/scripts:ro
      - ./worklists:/var/lib/orthanc/worklists
    environment:
      - VERBOSE_STARTUP=true
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - OSIMIS_WEB_VIEWER1_PLUGIN_ENABLED=true
      - WSI_PLUGIN_ENABLED=false
      - SIMRS_WEBHOOK_URL=${SIMRS_WEBHOOK_URL:-http://192.168.188.207:8090/api/radiology/notify-stored}
    depends_on:
      orthanc-postgres:
        condition: service_healthy
    networks:
      - orthanc-network

  orthanc-mwl:
    build: ./mwl
    container_name: orthanc-mwl
    restart: unless-stopped
    command: python polling_engine.py
    environment:
      - MWL_AE_TITLE=ORTHANC
      - MWL_PORT=4242
      - WORKLISTS_DIR=/var/lib/orthanc/worklists
      - HMS_SQLSERVER_HOST=${HMS_SQLSERVER_HOST}
      - HMS_SQLSERVER_PORT=${HMS_SQLSERVER_PORT:-1433}
      - HMS_SQLSERVER_DB=${HMS_SQLSERVER_DB}
      - HMS_SQLSERVER_USER=${HMS_SQLSERVER_USER}
      - HMS_SQLSERVER_PASSWORD=${HMS_SQLSERVER_PASSWORD}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-5}
      - POLL_DAYS_BACK=${POLL_DAYS_BACK:-1}
      - ORTHANC_URL=http://orthanc:8090/instances
      - ORTHANC_USER=orthanc
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
    volumes:
      - ./worklists:/var/lib/orthanc/worklists
    networks:
      - orthanc-network

  orthanc-auth:
    build: ./orthanc-auth
    container_name: orthanc-auth
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - ORTHANC_PASSWORD=${ORTHANC_PASSWORD}
      - ORTHANC_USER=orthanc
      - UPSTREAM=http://orthanc:8090
      - PROXY_PORT=8090
    volumes:
      - ./worklists:/var/lib/orthanc/worklists
    depends_on:
      - orthanc
    networks:
      - orthanc-network

  orthanc-postgres:
    image: postgres:15-alpine
    container_name: orthanc-postgres
    restart: unless-stopped
    volumes:
      - orthanc-pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orthanc -d orthanc"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - orthanc-network

  dicom-router:
    image: registry.dto.kemkes.go.id/pub/dicom-router:latest
    container_name: dicom-router
    restart: unless-stopped
    platform: linux/amd64
    ports:
      - "11112:11112"
    environment:
      - ORG_ID=${SATUSEHAT_ORG_ID}
      - CLIENT=${SATUSEHAT_CLIENT}
      - SECRET=${SATUSEHAT_SECRET}
      - URL=${SATUSEHAT_URL}
    volumes:
      - ./satusehat-router/router.conf:/config/router.conf:ro
      - satusehat-router-in:/app/in
    networks:
      - orthanc-network

volumes:
  orthanc-pgdata:
  satusehat-router-in:

networks:
  orthanc-network:
    driver: bridge
