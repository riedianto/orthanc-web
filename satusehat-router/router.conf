[satusehat]
; Konfigurasi global router
url = https://api-satusehat.kemkes.go.id
dicom_pathsuffix = /dicom/v1/dicomWeb/studies
fhir_pathsuffix = /fhir-r4/v1
tz_name = Asia/Jakarta
ae_title = DCMROUTER
dicom_port = 11112
dcm_dir = /in/
http_port = 8080
mroc_client_url = http://localhost:8000
auto_delete_incoming = true
webhook_url = https://example.com/log
webhook_user = user
webhook_password = 123

; Mode lama: single-tenant
; Isi kredensial langsung di section [satusehat] jika hanya ada 1 faskes
organization_id = ${ORG_ID}
client_key = ${CLIENT}
secret_key = ${SECRET}
calling_ae_title =

; worker dicom push
dicom_push_scheduler_enabled = true
dicom_push_scheduler_cron = */6 * * * *
dicom_push_scheduler_batch_size = 10

; Mode multi-tenant:
; Tambahkan 1 section untuk tiap faskes/tenant
; Router akan memilih tenant berdasarkan Calling AE Title dari koneksi DICOM yang masuk
; [satusehat.default]
; Contoh tenant/faskes A
; calling_ae_title = MODALITY_A
; organization_id = ${ORG_ID_A}
; client_key = ${CLIENT_A}
; secret_key = ${SECRET_A}

; [satusehat.rsb]
; Contoh tenant/faskes B
; calling_ae_title = MODALITY_B
; organization_id = ${ORG_ID_B}
; client_key = ${CLIENT_B}
; secret_key = ${SECRET_B}
